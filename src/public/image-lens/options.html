<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>千寻助手 · 图透镜设置</title>
    <link rel="icon" href="../icon/32.png" />
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="main">
      <header class="page-head">
        <div class="brand"><img src="../icon/48.png" width="28" height="28" alt="" /><span id="brand-name">千寻助手</span><span class="brand-divider">/</span><h1 id="settings-title">图透镜设置</h1></div>
        <div class="save-state"><span id="autosave-note">修改自动保存</span><p id="status" class="status" role="status" aria-live="polite"></p></div>
      </header>
      <form id="settings-form" novalidate>
        <!-- Signing in with BOFT.AI is the easy path; an own API key is the alternative. -->
        <section class="section" aria-labelledby="connection-title">
          <h2 class="section-title" id="connection-title">AI 连接</h2>
          <div class="card">
            <div class="row account-row" id="boft-account">
              <span class="row-label"><span id="boft-title">BOFT.AI</span><small id="boft-account-status" role="status" aria-live="polite"></small></span>
              <span class="boft-actions"><button id="boft-disconnect" class="btn" type="button" hidden></button><button id="boft-connect" class="btn" type="button"></button></span>
            </div>
            <p id="boft-feedback" class="feedback" role="status" aria-live="polite"></p>
            <details class="fold" id="own-key">
              <summary id="boft-manual-label">使用自己的 API Key</summary>
              <label class="row"><span class="row-label" id="prompt-provider-label">服务商</span><span class="row-control"><select name="promptProvider" aria-labelledby="prompt-provider-label"></select></span></label>
              <label class="row" id="boft-key-row"><span class="row-label" id="boft-key-label">BOFT.AI API Key</span><span class="row-control key-field"><input name="boftApiKey" type="password" autocomplete="off" spellcheck="false" /><button class="key-toggle" data-key-for="boftApiKey" type="button">显示</button></span></label>
              <label class="row" id="prompt-key-row"><span class="row-label"><span id="prompt-api-key-label">API Key</span><small id="local-storage-note">仅保存在本机</small></span><span class="row-control key-field"><input name="promptApiKey" type="password" autocomplete="off" spellcheck="false" /><button class="key-toggle" data-key-for="promptApiKey" type="button">显示</button></span></label>
              <label class="row" id="prompt-base-url-row"><span class="row-label" id="prompt-base-url-label">Base URL</span><span class="row-control"><input name="promptBaseUrl" type="url" autocomplete="off" spellcheck="false" /></span></label>
            </details>
          </div>
        </section>
        <section class="section" aria-labelledby="preferences-title">
          <h2 class="section-title" id="preferences-title">偏好</h2>
          <div class="card">
            <label class="row switch-row"><span class="row-label"><span id="hover-button-enabled-label">在图片上显示入口</span><small id="hover-button-enabled-note"></small></span><input class="switch" name="hoverButtonEnabled" type="checkbox" /></label>
            <label class="row switch-row"><span class="row-label" id="auto-analyze-label">打开面板后自动识别</span><input class="switch" name="autoAnalyze" type="checkbox" /></label>
            <label class="row switch-row"><span class="row-label" id="enable-chinese-recognition-label">生成中文提示词</span><input class="switch" name="enableChineseRecognition" type="checkbox" /></label>
            <label class="row switch-row"><span class="row-label"><span id="image-generation-enabled-label">开启生图</span><small id="image-generation-enabled-note"></small></span><input class="switch" name="imageGenerationEnabled" type="checkbox" /></label>
          </div>
        </section>
        <!-- Everything most people never change. -->
        <details class="advanced" id="advanced">
          <summary id="advanced-title">高级</summary>
          <div class="advanced-body">
            <section class="section" aria-labelledby="models-title">
              <div class="section-head"><h3 class="section-title" id="models-title">模型</h3><button id="boft-models" class="link-button" type="button">读取可用模型</button></div>
              <datalist id="boft-model-list"></datalist>
              <div class="card">
                <label class="row"><span class="row-label" id="prompt-model-label">识图模型</span><span class="row-control"><input name="promptModel" list="boft-model-list" type="text" spellcheck="false" /></span></label>
                <div id="image-settings-group">
                  <label class="row"><span class="row-label"><span id="image-model-label">生图模型</span><small id="image-model-help">需支持图片输出</small></span><span class="row-control"><input name="imageModel" list="boft-model-list" type="text" spellcheck="false" /></span></label>
                  <label class="row switch-row"><span class="row-label"><span id="separate-image-connection-label">生图使用独立连接</span><small id="separate-image-connection-note">仅在生图需要其他服务商或密钥时开启</small></span><input class="switch" name="separateImageConnection" type="checkbox" /></label>
                  <div id="image-connection-fields" hidden>
                    <label class="row"><span class="row-label" id="image-provider-label">生图服务商</span><span class="row-control"><select name="imageProvider" aria-labelledby="image-provider-label"></select></span></label>
                    <label class="row"><span class="row-label" id="image-api-key-label">API Key</span><span class="row-control key-field"><input name="imageApiKey" type="password" autocomplete="off" spellcheck="false" /><button class="key-toggle" data-key-for="imageApiKey" type="button">显示</button></span></label>
                    <label class="row"><span class="row-label" id="image-base-url-label">Base URL</span><span class="row-control"><input name="imageBaseUrl" type="url" autocomplete="off" spellcheck="false" /></span></label>
                  </div>
                </div>
              </div>
            </section>
            <section class="section" aria-labelledby="analysis-prompt-title">
              <div class="section-head"><h3 class="section-title" id="analysis-prompt-title">识图提示词</h3><button id="reset-analysis-instructions" class="link-button" type="button">恢复默认</button></div>
              <div class="card prompt-editor">
                <label for="analysis-instructions" id="analysis-instructions-label" class="visually-hidden">识图指令</label>
                <p class="note" id="analysis-instructions-note">自定义识别重点、描述风格和细节要求。结构化返回格式由插件维护。</p>
                <textarea id="analysis-instructions" name="analysisInstructions" rows="10" spellcheck="false" aria-describedby="analysis-instructions-note analysis-instructions-hint"></textarea>
                <p class="note editor-foot"><span id="analysis-instructions-hint">修改自动保存，下次识图生效；清空则使用默认指令。</span><span id="analysis-instructions-state"></span></p>
              </div>
            </section>
            <section class="section" aria-labelledby="interface-title">
              <h3 class="section-title" id="interface-title">界面</h3>
              <div class="card">
                <label class="row"><span class="row-label" id="ui-language-label">界面语言</span><span class="row-control"><select name="uiLanguage"></select></span></label>
              </div>
            </section>
          </div>
        </details>
      </form>
      <footer class="page-footer">
        <div class="links"><button id="open-doc" class="link-button" type="button">使用文档</button><a id="about-github" href="https://github.com/LIBERSEEK/OpenSeek-EXTENSIONS" target="_blank" rel="noopener">GitHub</a><a id="about-feedback" href="https://github.com/LIBERSEEK/OpenSeek-EXTENSIONS/issues" target="_blank" rel="noopener">提交反馈</a><a id="about-privacy" href="https://github.com/LIBERSEEK/OpenSeek-EXTENSIONS/blob/develop/PRIVACY.CN.md" target="_blank" rel="noopener">隐私政策</a></div>
        <p id="options-note" class="note"></p>
        <p class="note"><span id="about-version-label">版本</span> <span id="about-version" class="mono">-</span> · © 2026 LIBERSEEK · <a id="about-upstream" href="https://github.com/kevinchin12/ImageLens" target="_blank" rel="noopener">ImageLens (MIT)</a></p>
      </footer>
    </main>
    <script src="./i18n.js"></script>
    <script src="./options.js"></script>
  </body>
</html>
