<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="../icon/32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图透镜结果</title>
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <img src="../icon/48.png" width="26" height="26" alt="" />
          <strong id="viewer-eyebrow">千寻助手</strong>
        </div>
        <div class="actions">
          <button id="copy-prompt" class="btn" type="button" disabled>复制提示词</button>
          <button id="download-images" class="btn btn-primary" type="button" disabled>下载图片</button>
        </div>
      </header>

      <section class="prompt-card">
        <h1 id="viewer-heading">提示词</h1>
        <p id="prompt" class="prompt">载入中…</p>
      </section>

      <section id="gallery" class="gallery"></section>
    </main>

    <script src="./i18n.js"></script>
    <script src="./viewer.js"></script>
  </body>
</html>
